<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>개발자 벤치마크</title><link rel="stylesheet" href="/src/style.css"></head><body><main class="tool-page"><section class="card"><a href="/">← 알약 카운터</a><h1>브라우저 벤치마크</h1><p>manifest의 이미지와 정답 중심을 읽어 현재 detector 결과와 비교합니다. 실제 이미지가 없으면 정확도를 주장하지 않습니다.</p><label class="button primary">manifest.json 불러오기<input id="manifest" type="file" accept=".json,application/json" hidden></label><label class="button secondary">이미지 파일 선택(선택)<input id="images" type="file" accept="image/*" multiple hidden></label><button id="run" class="button secondary" disabled>벤치마크 실행</button><div id="summary"></div><div class="benchmark-stage"><canvas id="canvas"></canvas></div><pre id="details"></pre></section></main><script type="module" src="/src/benchmark.js"></script></body></html>
