<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>알약 엔진 비교</title><link rel="stylesheet" href="style.css"><main style="max-width:1000px;margin:40px auto;padding:20px"><a href="index.html">← 카운터로 돌아가기</a><h1>내 사진으로 엔진 비교</h1><p>사진과 실제 수량을 입력하면 같은 사진을 AI와 OpenCV로 분석합니다. 사진은 이 브라우저에서만 처리됩니다. AI 기준 0.50, OpenCV 감도 0.80을 고정해서 비교합니다.</p><input id="photos" type="file" accept="image/*" multiple><div id="inputs"></div><button id="run" disabled>비교 시작</button><p id="status" role="status"></p><div style="overflow:auto"><table><thead><tr><th>사진</th><th>정답</th><th>AI 수량 / 오차 / 시간</th><th>OpenCV 수량 / 오차 / 시간</th></tr></thead><tbody id="results"></tbody></table></div><p id="summary"></p><p>수량이 같아도 검출 위치가 틀릴 수 있습니다. 결과를 직접 검수하세요. 약품 종류를 식별하는 기능은 제공하지 않습니다.</p></main><script type="module" src="src/benchmark.js"></script></html>
