<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>개발자 주석 도구</title><link rel="stylesheet" href="/src/style.css"></head><body><main class="tool-page"><section class="card"><a href="/">← 알약 카운터</a><h1>개발자용 정답 주석</h1><p>이미지는 브라우저에서만 처리됩니다. 마커를 클릭하면 삭제되고, 빈 곳을 클릭하면 추가됩니다.</p><label class="button primary">이미지 불러오기<input id="image" type="file" accept="image/*" hidden></label><button id="download" class="button secondary" disabled>검증된 JSON 다운로드</button><span id="count" class="badge">0개</span><div class="annotation-stage"><canvas id="canvas"></canvas></div><textarea id="json" rows="8" placeholder="정답 JSON을 검토하거나 수정한 뒤 다운로드하세요"></textarea><p id="message" class="notice"></p></section></main><script type="module" src="/src/annotation.js"></script></body></html>
